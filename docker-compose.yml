version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: shelter-db
    environment:
      POSTGRES_DB: shelter_db
      POSTGRES_USER: thermal_admin
      POSTGRES_PASSWORD: securepassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermal_admin -d shelter_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  thermal-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shelter-thermal-engine
    environment:
      DATABASE_URL: postgresql://thermal_admin:securepassword123@db:5432/shelter_db
      NASA_POWER_API_URL: https://power.larc.nasa.gov/api/temporal/daily/point
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shelter-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - thermal-engine
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  postgres_data: